<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Signature 9 - Timeline Style</title>
</head>
<body style="margin:0; padding:0; background-color:#e0e0e0; height:100vh; display:flex; align-items:center; justify-content:center; font-family:Arial, sans-serif;">

  <!-- Signature Container -->
  <table cellpadding="0" cellspacing="0" role="presentation" style="background-color:#ffffff; border-radius:12px; padding:25px; text-align:center; box-shadow:0 5px 15px rgba(0,0,0,0.2); max-width:400px;">
    
    <!-- Profile Image -->
    <tr>
      <td style="padding-bottom:15px;">
        <img src="profile-image.png" width="90" height="90" style="border-radius:50%; border:3px solid #3498db;" alt="Ababil Hassan">
      </td>
    </tr>
    
    <!-- Name -->
    <tr>
      <td style="font-size:20px; font-weight:bold; color:#111; padding-bottom:10px;">Ababil Hassan</td>
    </tr>
    
    <!-- Title -->
    <tr>
      <td style="font-size:13px; color:#555; padding-bottom:15px;">Front-End Developer | Email Designer</td>
    </tr>
    
    <!-- Timeline Style Contact Info -->
    <tr>
      <td style="text-align:left; padding:0 30px;">
        <div style="display:flex; align-items:center; margin-bottom:6px;">
          <div style="width:10px; height:10px; background-color:#3498db; border-radius:50%; margin-right:8px;"></div>
          <div style="font-size:13px;">📞 <a href="tel:+8801234567890" style="color:#3498db; text-decoration:none;">+880 1234-567890</a></div>
        </div>
        <div style="display:flex; align-items:center; margin-bottom:6px;">
          <div style="width:10px; height:10px; background-color:#3498db; border-radius:50%; margin-right:8px;"></div>
          <div style="font-size:13px;">✉️ <a href="mailto:ababil@email.com" style="color:#3498db; text-decoration:none;">ababil@email.com</a></div>
        </div>
        <div style="display:flex; align-items:center; margin-bottom:6px;">
          <div style="width:10px; height:10px; background-color:#3498db; border-radius:50%; margin-right:8px;"></div>
          <div style="font-size:13px;">🌐 <a href="https://ababilhassan.dev" style="color:#3498db; text-decoration:none;">ababilhassan.dev</a></div>
        </div>
        <div style="display:flex; align-items:center; margin-bottom:6px;">
          <div style="width:10px; height:10px; background-color:#3498db; border-radius:50%; margin-right:8px;"></div>
          <div style="font-size:13px;">📍 Dhaka, Bangladesh</div>
        </div>
      </td>
    </tr>
    
    <!-- Social Icons -->
    <tr>
      <td style="padding-top:12px;">
        <a href="https://linkedin.com" style="margin:0 6px;"><img src="https://cdn-icons-png.flaticon.com/24/174/174857.png" width="20" height="20" alt="LinkedIn"></a>
        <a href="https://github.com" style="margin:0 6px;"><img src="https://cdn-icons-png.flaticon.com/24/733/733553.png" width="20" height="20" alt="GitHub"></a>
        <a href="https://twitter.com" style="margin:0 6px;"><img src="https://cdn-icons-png.flaticon.com/24/733/733579.png" width="20" height="20" alt="Twitter"></a>
      </td>
    </tr>

  </table>

</body>
</html>
